[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tc-cmlp"
version = "0.2.0"
description = "Temporally coupled cMLP based on the original Neural-GC implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
preprocess = ["pyedflib>=0.1.40"]

[project.scripts]
tc-cmlp = "tc_cmlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
