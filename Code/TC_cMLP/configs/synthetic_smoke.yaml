seed: 42

data:
  num_series: 5
  num_windows: 4
  points_per_window: 100
  lag: 2
  noise_std: 0.15
  change_window: 2

model:
  hidden: [8]
  activation: relu

training:
  max_iter: 100
  learning_rate: 0.05
  lambda_group: 0.008
  lambda_ridge: 0.001
  lambda_temporal: 0.01
  check_every: 20
  lookback: 5
  seed: 42
  device: cpu
  torch_threads: 1

methods:
  - cmlp
  - tc_no_temporal
  - tc

output_dir: results/synthetic/smoke_seed_42
