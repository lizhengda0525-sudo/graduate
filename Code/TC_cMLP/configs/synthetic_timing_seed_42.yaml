seed: 42

data:
  num_series: 10
  num_windows: 20
  points_per_window: 500
  lag: 2
  noise_std: 0.15
  change_window: 10

model:
  hidden: [16]
  activation: relu

training:
  max_iter: 2000
  learning_rate: 0.05
  lambda_group: 0.008
  lambda_ridge: 0.001
  lambda_temporal: 0.01
  check_every: 100
  lookback: 5
  seed: 42
  device: cpu
  torch_threads: 1

methods:
  - cmlp
  - tc_no_temporal
  - tc

output_dir: results/synthetic/seed_42_timing
